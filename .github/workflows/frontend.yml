name: Frontend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: React and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Check formatting
        run: npm --prefix frontend run format:check
      - name: Check types
        run: npm --prefix frontend run typecheck
      - name: Run React tests
        run: npm --prefix frontend test -- --reporter=dot
      - name: Build frontend
        run: npm --prefix frontend run build
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install demo backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Run browser journeys against an isolated synthetic case
        env:
          BOUSSLA_E2E_URL: http://127.0.0.1:8000
          LLM_PROVIDER: manual
          JEV_ENABLED: "false"
          LANGSMITH_TRACING: "false"
        run: |
          set -euo pipefail
          demo_dir="$RUNNER_TEMP/boussla-ci"
          mkdir -p "$demo_dir/uploads"
          export CASE_DB_PATH="$demo_dir/cases.sqlite"
          export CHECKPOINT_DB_PATH="$demo_dir/checkpoints.sqlite"
          export UPLOAD_DIR="$demo_dir/uploads"
          export EVENT_LOG_PATH="$demo_dir/events.jsonl"
          export PORTFOLIO_STATE_PATH="$demo_dir/portfolio.json"
          python -m uvicorn boussla.web.app:app --host 127.0.0.1 --port 8000 > "$demo_dir/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8000/; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$demo_dir/server.log"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --output /dev/null http://127.0.0.1:8000/
          npm --prefix frontend run test:e2e
